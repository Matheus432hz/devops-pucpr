name: Continuous Delivery
on: 
  push:
    branches:
      - main

jobs:
  Deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: simulating continuous delivery 
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact-zipped
          path: |
            *.py
            README.md